  - fwupd
  - systemd-resolved
  - systemd-container
  - systemd-oomd
  - libcamera
  - libcamera-v4l2
  - libcamera-gstreamer
  - libcamera-tools
  
  # Group: KDE Plasma Workspaces
  - kwin
  - plasma-workspace
  - plasma-workspace-wayland
